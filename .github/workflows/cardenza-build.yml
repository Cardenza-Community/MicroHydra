name: Cardenza build
on:
  push:
    branches: [main, nightly]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cardenza-${{ github.ref }}
  cancel-in-progress: false
jobs:
  cardenza:
    if: github.repository == 'Cardenza-Community/MicroHydra'
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      PLATFORMIO_CORE_DIR: /tmp/203-launcher-pio
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build and check Cardenza support
        shell: bash
        run: |
          ./esp-idf/install.sh esp32s3
          . esp-idf/export.sh
          python -m pip install pyyaml
          python tools/create_frozen_folders.py
          python tools/parse_files.py --frozen
          make -C MicroPython/ports/esp32 BOARD=CARDENZA -j4
          python tools/test_cardenza.py
      - name: Prepare app-only image and licensing notices
        run: python3 .github/launcher/prepare.py MicroPython/ports/esp32/build-CARDENZA/micropython.bin
      - name: Files for the author to attach to a Release
        uses: actions/upload-artifact@v4
        with:
          name: Cardenza
          include-hidden-files: true
          path: |
            .git/launcher-output/Cardenza.bin
            .git/launcher-output/NOTICES.txt
